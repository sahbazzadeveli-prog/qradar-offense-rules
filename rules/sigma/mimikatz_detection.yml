title: Mimikatz Detection via LSASS Access
id: mimi-detect-002
status: production
description: Detects Mimikatz credential dumping tool by monitoring suspicious access to LSASS process memory
author: SOC Team
date: 2024/01/01
category: sigma
severity: critical
mitre:
  tactic: Credential Access
  technique: T1003.001

qradar:
  rule_name: "SIGMA - Mimikatz LSASS Memory Access"
  rule_type: "EventRule"
  severity: critical
  credibility: 9
  relevance: 10

detection:
  condition: >
    ProcessName MATCHES '.*lsass.*' AND
    EventID = '4656' OR EventID = '4663' AND
    AccessMask MATCHES '0x1010' OR AccessMask MATCHES '0x1410'

  timeframe: 1m
  threshold: 1

response:
  - Immediately isolate system
  - Reset all domain credentials
  - Capture memory forensics
  - Escalate to IR team
