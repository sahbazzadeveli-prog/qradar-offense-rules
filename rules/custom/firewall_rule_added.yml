title: New Firewall Rule Added
id: custom-fw-009
status: production
description: Detects addition of new firewall rules which may be used by attackers to allow malicious traffic
author: SOC Team
date: 2024/01/01
category: custom
severity: high
mitre:
  tactic: Defense Evasion
  technique: T1562.004

qradar:
  rule_name: "CUSTOM - New Firewall Rule Added"
  rule_type: "EventRule"
  severity: high
  credibility: 8
  relevance: 9

detection:
  condition: >
    EventID = '4946' OR EventID = '4947' OR
    CommandLine MATCHES '.*netsh advfirewall.*add.*' OR
    CommandLine MATCHES '.*New-NetFirewallRule.*'
  timeframe: 1m
  threshold: 1

response:
  - Review new firewall rule details
  - Remove unauthorized rules
  - Check who made the change
