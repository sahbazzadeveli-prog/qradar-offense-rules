id: QRD-AD-005
name: Active Directory - Defense Evasion Detection
author: Sahbazzade Veli
description: Detects defense evasion techniques including disabling security tools, clearing event logs and modifying audit policies to avoid detection.
severity: 8
status: production
rule_type: Custom Rule Engine (CRE) Event Rule
mitre_attack:
  tactic: Defense Evasion (TA0005)
  technique: 'Impair Defenses: Disable or Modify Tools (T1562.001)'
aql_query: 'SELECT "Username", sourceip, "Process Name", COUNT(*) AS evasion_count
  FROM events
  WHERE "EventID" = ''4719'' OR "EventID" = ''4948'' OR "EventID" = ''1102''
  OR "EventID" = ''4688'' AND "Process Name" ILIKE ''%sc.exe%''
  GROUP BY "Username", sourceip, "Process Name"
  HAVING evasion_count >= 1
  LAST 10 MINUTES'
rule_response:
  ensure_offense: true
  index_offense_by: sourceip
  event_name: 'CRE: Defense Evasion Detected'
response_playbook:
  - Immediately re-enable disabled security tools and services.
  - Investigate the source account for unauthorized changes.
  - Restore audit policies to their original configuration.
