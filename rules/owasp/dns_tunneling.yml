title: DNS Tunneling Detection
id: owasp-dns-006
status: production
description: Detects potential DNS tunneling used for data exfiltration via abnormal DNS query patterns
author: SOC Team
date: 2024/01/01
category: owasp
severity: critical
mitre:
  tactic: Exfiltration
  technique: T1048.003

qradar:
  rule_name: "OWASP - DNS Tunneling Exfiltration"
  rule_type: "EventRule"
  severity: critical
  credibility: 9
  relevance: 10

detection:
  condition: >
    DestinationPort = '53' AND
    DNSQueryLength > 50 AND
    SameSourceIP COUNT > 100
  timeframe: 5m
  threshold: 100

response:
  - Block suspicious DNS traffic
  - Capture DNS logs
  - Investigate source host
