title: Suspicious Scheduled Task Creation
id: sched-task-003
status: production
description: Detects creation of scheduled tasks commonly used by attackers for persistence
author: SOC Team
date: 2024/01/01
category: sigma
severity: high
mitre:
  tactic: Persistence
  technique: T1053.005

qradar:
  rule_name: "SIGMA - Suspicious Scheduled Task Creation"
  rule_type: "EventRule"
  severity: high
  credibility: 8
  relevance: 9

detection:
  condition: >
    EventID = '4698' OR
    CommandLine MATCHES '.*schtasks.*\/create.*' OR
    CommandLine MATCHES '.*at\.exe.*'
  timeframe: 1m
  threshold: 1

response:
  - Review scheduled task details
  - Check task owner and command
  - Remove if unauthorized
