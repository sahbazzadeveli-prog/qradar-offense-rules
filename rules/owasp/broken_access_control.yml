title: Broken Access Control Detection
id: owasp-bac-004
status: production
description: >
  Detects repeated HTTP 401/403 responses from the same source IP,
  indicating attempts to access unauthorized resources.
author: SOC Team
date: 2024/01/01
category: owasp
severity: high
mitre:
  tactic: Discovery
  technique: T1083

qradar:
  rule_name: "OWASP - Broken Access Control Attempt"
  rule_type: EventRule
  offense: true
  severity: 8
  credibility: 8
  relevance: 9
  expression: >
    SELECT sourceip, username, \"Event ID\", COUNT(*) AS attempts
    FROM events
    WHERE \"Event ID\"='4625'
    OR \"Event ID\"='4656'
    GROUP BY sourceip
    HAVING attempts >= 10
    LAST 5 MINUTES
  cre_logic: >
    Test 1: Event ID equals 4625 OR 4656,
    count >= 10 grouped by Source IP in 5 min.
    Response: Dispatch New Event, Ensure part of offense

detection:
  timeframe: 5m
  threshold: 10
  condition: same_source_ip

response:
  - Block source IP temporarily
  - Review access logs
  - Check user permissions
  - Escalate if repeated
