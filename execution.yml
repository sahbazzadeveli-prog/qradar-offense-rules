id: QRD-AD-007
name: Active Directory - Suspicious Process Execution Detection
author: Sahbazzade Veli
description: Detects suspicious process execution attempts including PowerShell, CMD and other living-off-the-land binaries used by attackers for malicious purposes.
severity: 8
status: production
rule_type: Custom Rule Engine (CRE) Event Rule
mitre_attack:
  tactic: Execution (TA0002)
  technique: 'Command and Scripting Interpreter: PowerShell (T1059.001)'
aql_query: 'SELECT "Username", sourceip, "Process Name", "Command Line", COUNT(*) AS exec_count
  FROM events
  WHERE "EventID" = ''4688''
  AND ("Process Name" ILIKE ''%powershell%''
  OR "Process Name" ILIKE ''%cmd.exe%''
  OR "Process Name" ILIKE ''%wscript%''
  OR "Process Name" ILIKE ''%mshta%'')
  GROUP BY "Username", sourceip, "Process Name", "Command Line"
  HAVING exec_count >= 3
  LAST 10 MINUTES'
rule_response:
  ensure_offense: true
  index_offense_by: sourceip
  event_name: 'CRE: Suspicious Process Execution Detected'
response_playbook:
  - Analyze the full command line arguments of the suspicious process.
  - Isolate the affected system if malicious activity is confirmed.
  - Check parent process to identify the execution chain.
