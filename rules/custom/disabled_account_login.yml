title: Disabled Account Login Attempt
id: custom-dis-010
status: production
description: Detects login attempts using disabled user accounts which may indicate credential stuffing or insider threat
author: SOC Team
date: 2024/01/01
category: custom
severity: high
mitre:
  tactic: Initial Access
  technique: T1078.003

qradar:
  rule_name: "CUSTOM - Disabled Account Login Attempt"
  rule_type: "EventRule"
  severity: high
  credibility: 9
  relevance: 9

detection:
  condition: >
    EventID = '4625' AND
    SubStatus = '0xC0000072' OR
    FailureReason MATCHES '.*Account disabled.*'
  timeframe: 5m
  threshold: 1

response:
  - Investigate who attempted login
  - Check if account should be re-enabled
  - Block source IP if repeated attempts
