title: Cryptographic Failure - Unencrypted Sensitive Data
id: owasp-crypto-005
status: production
description: Detects sensitive data transmitted over unencrypted HTTP connections
author: SOC Team
date: 2024/01/01
category: owasp
severity: high
mitre:
  tactic: Collection
  technique: T1040

qradar:
  rule_name: "OWASP - Sensitive Data Over HTTP"
  rule_type: "EventRule"
  severity: high
  credibility: 8
  relevance: 9

detection:
  condition: >
    DestinationPort = '80' AND
    PayloadContent MATCHES '.*password.*' OR
    PayloadContent MATCHES '.*passwd.*' OR
    PayloadContent MATCHES '.*credit_card.*' OR
    PayloadContent MATCHES '.*token.*'
  timeframe: 1m
  threshold: 1

response:
  - Block HTTP transmission
  - Enforce HTTPS policy
  - Notify data owner
