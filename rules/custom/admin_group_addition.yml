title: User Added to Administrator Group
id: custom-admin-008
status: production
description: Detects when a user account is added to the local administrators group
author: SOC Team
date: 2024/01/01
category: custom
severity: high
mitre:
  tactic: Privilege Escalation
  technique: T1078.003

qradar:
  rule_name: "CUSTOM - User Added to Admin Group"
  rule_type: "EventRule"
  severity: high
  credibility: 9
  relevance: 10

detection:
  condition: >
    EventID = '4732' OR
    CommandLine MATCHES '.*net localgroup administrators.*\/add.*'
  timeframe: 1m
  threshold: 1

response:
  - Immediately verify authorization
  - Remove if unauthorized
  - Escalate to security team
