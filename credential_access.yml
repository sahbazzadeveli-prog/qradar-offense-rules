id: QRD-AD-004
name: Active Directory - Credential Access Detection
author: Sahbazzade Veli
description: Detects suspicious credential access attempts including LSASS memory dumping and credential harvesting from Windows systems.
severity: 9
status: production
rule_type: Custom Rule Engine (CRE) Event Rule
mitre_attack:
  tactic: Credential Access (TA0006)
  technique: 'OS Credential Dumping: LSASS Memory (T1003.001)'
aql_query: 'SELECT "Username", sourceip, "Process Name", COUNT(*) AS access_count
  FROM events
  WHERE "EventID" = ''4656'' OR "EventID" = ''4663'' OR "EventID" = ''10''
  AND "Process Name" ILIKE ''%lsass%''
  GROUP BY "Username", sourceip, "Process Name"
  HAVING access_count >= 1
  LAST 10 MINUTES'
rule_response:
  ensure_offense: true
  index_offense_by: sourceip
  event_name: 'CRE: Credential Access Detected'
response_playbook:
  - Isolate the affected system immediately from the network.
  - Dump and analyze memory of the suspicious process.
  - Reset credentials of all accounts on the compromised system.
